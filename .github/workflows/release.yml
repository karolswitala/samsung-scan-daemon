name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Build & publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: make build-mac && make build-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/samsung-scan-macos
            dist/samsung-scan-linux
